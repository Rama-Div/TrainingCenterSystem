<div style="max-width: 500px; margin: 2rem auto;">
  <h2>{{ instructorId() ? 'Edit Instructor' : 'Add Instructor' }}</h2>

  @if (errorMessage()) {
    <app-error-message [message]="errorMessage()!" />
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label>Name</label>
      <input type="text" formControlName="name" style="width: 100%; padding: 8px; margin-bottom: 12px;" />
    </div>

    <div>
      <label>Email</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 8px; margin-bottom: 12px;" />
    </div>

    <div>
      <label>Specialization</label>
      <input type="text" formControlName="specialization" style="width: 100%; padding: 8px; margin-bottom: 12px;" />
    </div>

    <button type="submit" [disabled]="form.invalid || loading()" style="padding: 10px 20px; cursor: pointer;">
      {{ loading() ? 'Saving...' : 'Submit Instructor' }}
    </button>
  </form>
</div>
