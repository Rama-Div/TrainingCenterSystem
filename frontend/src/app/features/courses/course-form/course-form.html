<div style="max-width: 500px; margin: 2rem auto;">
  <h2>{{ courseId() ? 'Edit Course' : 'Create Course' }}</h2>

  @if (errorMessage()) {
    <app-error-message [message]="errorMessage()!" />
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label style="display: block; margin-top: 8px;">Title</label>
      <input type="text" formControlName="title" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;" />
    </div>

    <div>
      <label style="display: block; margin-top: 8px;">Description</label>
      <textarea formControlName="description" rows="3" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></textarea>
    </div>

    <div>
      <label style="display: block; margin-top: 8px;">Capacity</label>
      <input type="number" formControlName="capacity" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;" />
    </div>

    <div>
      <label style="display: block; margin-top: 8px;">Start Date</label>
      <input type="date" formControlName="startDate" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;" />
    </div>

    <div>
      <label style="display: block; margin-top: 8px;">End Date</label>
      <input type="date" formControlName="endDate" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;" />
    </div>

    <div>
      <label style="display: block; margin-top: 8px;">Assign Instructor (Optional)</label>
      <select formControlName="instructorId" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
        <option [ngValue]="null">-- Not Assigned --</option>
        @for (i of instructors(); track i.id) {
          <option [value]="i.id">{{ i.name }} ({{ i.specialization }})</option>
        }
      </select>
    </div>

    <button type="submit" [disabled]="form.invalid || loading()" style="margin-top: 16px; padding: 10px 20px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 4px;">
      {{ loading() ? 'Saving...' : 'Save Course' }}
    </button>
  </form>
</div>
