<div style="max-width: 400px; margin: 2rem auto;">
  <h2>Login</h2>

  @if (errorMessage()) {
    <app-error-message [message]="errorMessage()!" />
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label>Email</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 8px; margin: 4px 0 12px;" />
    </div>

    <div>
      <label>Password</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 8px; margin: 4px 0 12px;" />
    </div>

    <button type="submit" [disabled]="form.invalid || loading()" style="padding: 10px 20px; cursor: pointer;">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>
  </form>
  <p>Don't have an account? <a routerLink="/register">Register here</a></p>
</div>
